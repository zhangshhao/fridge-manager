# Include inside the existing HTTPS server block.
# Static files live in /opt/fridge-manager/fridge-manager/.
location = /fridge-manager { return 301 /fridge-manager/$is_args$args; }

location ^~ /fridge-manager/api/ {
    rewrite ^/fridge-manager(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path / /fridge-manager/;
    proxy_connect_timeout 5s;
    # Leave time for the configured 90-second AI generation timeout.
    proxy_read_timeout 120s;
    access_log off;
}

location ^~ /fridge-manager/assets/ {
    root /opt/fridge-manager;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location ^~ /fridge-manager/ {
    root /opt/fridge-manager;
    try_files $uri $uri/ /fridge-manager/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    access_log off;
}
